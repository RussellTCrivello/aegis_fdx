# AEGIS-FDX execution gate — real JDK 21 + real JavaFX 21, no Gradle required.
#
# Runs the repository's own batteries (run-tests.ps1 on Windows, run-tests.sh on
# Linux): full javac compile of main + tests, then every suite including the
# Unit 5 SearchResultResolverTest and the matrix inventories. This is the gate
# that turns NOT RUN rows into executed evidence.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows battery (JDK 21 + JavaFX 21 SDK)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      AEGIS_FX: C:\javafx-sdk-21.0.4\lib
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch JavaFX 21.0.4 SDK (Windows x64)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\openjfx.zip"
          Invoke-WebRequest -Uri 'https://download2.gluonhq.com/openjfx/21.0.4/openjfx-21.0.4_windows-x64_bin-sdk.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath 'C:\' -Force
          Get-ChildItem 'C:\javafx-sdk-21.0.4\lib\javafx.controls.jar' | Format-Table Name, Length

      - name: Toolchain versions
        shell: pwsh
        run: |
          javac -version
          java -version
          Get-ChildItem $env:AEGIS_FX\javafx.*.jar | Format-Table Name

      - name: Run full battery
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File run-tests.ps1 -Multiplier 2

  linux:
    name: Linux battery (JDK 21 + JavaFX 21 SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AEGIS_FX: /tmp/javafx-sdk-21.0.4/lib
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch JavaFX 21.0.4 SDK (Linux x64)
        run: |
          curl -sL -o /tmp/openjfx.zip 'https://download2.gluonhq.com/openjfx/21.0.4/openjfx-21.0.4_linux-x64_bin-sdk.zip'
          sudo unzip -q -o /tmp/openjfx.zip -d /tmp
          ls "$AEGIS_FX"/javafx.controls.jar

      - name: Toolchain versions
        run: |
          javac -version
          java -version
          ls "$AEGIS_FX"/javafx.*.jar

      - name: Run full battery
        run: bash run-tests.sh 2
